summary = "Give every villager a name to remember."
description = "Give Sunrise villagers names that suit their village: plains, desert, savanna, taiga or snowy. Villagefolk combines style-specific name lists with a shared list, all editable in the server's villagefolk-server.json config (globally or per world). Changes reload while the server runs; assigned names and name-tag renames persist across saves and restarts. Server-side only: multiplayer clients do not need the mod."
categories = ["social", "utility"]

