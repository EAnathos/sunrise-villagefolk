summary = "Give every villager a name to remember."
description = "Villagefolk gives villagers a name from a server-configurable list for their village style: plains, desert, savanna, taiga or snowy. Shared names can be used everywhere, and villagers keep their assigned names across saves and reloads."
categories = ["social", "utility"]

