name: Feature request
description: Suggest an improvement related to villagers and their names.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        For a large change, describe the player or server-owner problem first. Please check existing issues for similar proposals.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the use case or problem this would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you imagine the feature working in game or in the server configuration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches that might solve the same problem?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, or related issues are welcome.
    validations:
      required: false
